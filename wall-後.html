<script>
const pets=[
{name:'豆豆',breed:'黃金獵犬',kind:'watch',type:'觀賽隊友',emoji:'🐕',a:'#d2e8d0',b:'#f9e6c3',story:'只要主人開始看球，豆豆就會自動坐到最佳觀賽位置，陪著一起迎接每個精彩瞬間。'},
{name:'米妮',breed:'長毛臘腸犬',kind:'sport',type:'運動健將',emoji:'🐶',a:'#f7dfc3',b:'#fcefd6',story:'迷你身材，大大運動魂！每天最期待的就是跟主人出門散步與跑跑。'},

function openPet(p){document.getElementById('modalArt').style.setProperty('--a',p.a);document.getElementById('modalArt').style.setProperty('--b',p.b);document.getElementById('modalArt').innerHTML=`<span class="pet-emoji" aria-hidden="true">${p.emoji}</span>`;document.getElementById('mName').textContent=p.name;document.getElementById('mBreed').textContent=p.breed;document.getElementById('mStory').textContent=p.story;document.getElementById('mCat').textContent=p.type;overlay.classList.add('open');document.body.style.overflow='hidden'}

(()=>{
const prefix='elta_demo_';
const name=decodeURIComponent(location.pathname.split('/').pop());
const page=name.startsWith('wall-')?'wall':name.startsWith('winners-')?'winners':null;

// Explicit preview switch is isolated to photo wall and winners pages.

const title=document.createElement('div');title.textContent='網站原型｜畫面預覽';title.style.cssText='font-weight:800;margin-bottom:5px';wrap.appendChild(title);
for(const [key,label] of [['wall','照片牆'],['winners','得獎名單']]){
 const group=document.createElement('div');group.style.cssText='display:flex;align-items:center;gap:5px;margin:3px 0';
 const tag=document.createElement('span');tag.textContent=label+'：';tag.style.minWidth='64px';group.append(tag);
 for(const [stage,text] of [['before','公布前'],['after','公布後']]){
  const btn=document.createElement('button');btn.type='button';btn.textContent=text;
  const active=(localStorage.getItem(prefix+key)||'before')===stage;

  btn.addEventListener('click',()=>{localStorage.setItem(prefix+key,stage);location.href=key+'.html?stage='+stage});group.append(btn);
 }
 wrap.append(group);
}
const note=document.createElement('div');note.textContent='僅供介面展示，非正式公告';note.style.cssText='font-size:10px;color:#7c8e82;margin-top:4px';wrap.append(note);
document.body.appendChild(wrap);
})();
